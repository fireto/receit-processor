<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Бележки">
  <title>{% block title %}Бележки{% endblock %}</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="{{ static('icons/icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ static('icons/apple-touch-icon.png') }}">
  <link rel="stylesheet" href="{{ static('app.css') }}">
  <script src="{{ static('vendor/htmx.min.js') }}" defer></script>
  <script src="{{ static('app.js') }}" defer></script>
</head>
<body class="min-h-dvh bg-zinc-50 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">
  <header class="sticky top-0 z-20 border-b border-zinc-200/70 bg-zinc-50/85 backdrop-blur-md dark:border-white/5 dark:bg-zinc-950/85 pt-[env(safe-area-inset-top)]">
    <div class="mx-auto flex h-14 max-w-2xl items-center justify-between gap-3 px-4">
      <a href="/" class="flex items-center gap-2 text-lg font-semibold tracking-tight">
        <img src="{{ static('icons/icon.svg') }}" alt="" class="size-7 rounded-lg">
        Бележки
      </a>
      <nav class="flex items-center gap-2">
        <a href="/manual" class="btn btn-secondary btn-sm">
          <svg viewBox="0 0 20 20" fill="currentColor" class="size-4" aria-hidden="true"><path d="M10 4a1 1 0 0 1 1 1v4h4a1 1 0 1 1 0 2h-4v4a1 1 0 1 1-2 0v-4H5a1 1 0 1 1 0-2h4V5a1 1 0 0 1 1-1Z"/></svg>
          Ръчно
        </a>
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-2xl px-4 pb-24 pt-5">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
