# receit-processor — https://rec.fireto.net
# Runs on docker.sf.fireto.net from a clone in /opt/lab/receit-processor (./rebuild.sh).
# Traefik on rp.sf.fireto.net routes rec.fireto.net -> 10.20.10.11:8000; the route, port
# registry entry and Gatus check live in lab.sf.fireto.net/projects/receit-processor/.
# The app runs as uid 1000: ./data must exist and be owned by uid 1000 (rebuild.sh). The
# nightly backup runs `docker exec -u 1000:1000 receit-processor python3 …` against
# /app/data/receipts.db, hence the fixed container name.
services:
  app:
    build: .
    container_name: receit-processor
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TZ=Europe/Sofia
    volumes:
      - ./data:/app/data
      - ./service_account.json:/app/service_account.json:ro
    mem_limit: 384m
    # Liveness only (/livez). /healthz (reader thread, queue age, writable data) is for
    # Gatus: a restart cannot fix most of what it reports.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
